<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SAGE</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="root">

    <header>
      <span class="logo">⚡</span>
      <div>
        <div class="title">SAGE Prompt Advisor</div>
        <div id="site-badge" class="site-badge">Detecting…</div>
      </div>
      <div id="server-dot" class="dot-grey" title="Server status"></div>
    </header>

    <!-- live prompt preview -->
    <div class="section-label">Prompt detected on page</div>
    <div id="prompt-preview" class="prompt-preview">—</div>

    <!-- predict button -->
    <button id="predict-btn" disabled>Predict</button>

    <!-- results -->
    <div id="result-area"></div>

    <div class="footer">
      Server: <span id="server-url">localhost:5050</span>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
